<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Skjematisk plan</title>
  </head>
  <body>
    <header class="topbar no-print">
      <h1>Skjematisk plan</h1>
      <span id="version" class="muted"></span>
      <span class="spacer"></span>
      <span class="muted small">Sperre mot utgående trafikk: <strong id="csp-status">sjekker …</strong></span>
    </header>
    <main>
      <section class="panel no-print">
        <div class="toolbar">
          <label class="button primary">
            Åpne planfil
            <input id="file-input" type="file" accept=".json,application/json" hidden />
          </label>
          <div class="group" role="group" aria-label="Arkretning">
            <button type="button" data-orientation="landscape" aria-pressed="true">Liggende</button>
            <button type="button" data-orientation="portrait" aria-pressed="false">Stående</button>
          </div>
          <label class="field">Ark
            <select id="paper">
              <option value="A3" selected>A3</option>
              <option value="A2">A2</option>
              <option value="A1">A1</option>
            </select>
          </label>
          <div class="group" role="group" aria-label="Høyde på lanes">
            <button type="button" data-height="fill" aria-pressed="true" title="Lanes fyller hele arket">Fyll arket</button>
            <button type="button" data-height="compact" aria-pressed="false" title="Lanes blir så lave som boksene tillater">Kompakt</button>
          </div>
          <div class="group" role="group" aria-label="Stil">
            <button type="button" data-style="excel" aria-pressed="true" title="Slik Excel-løsningen tegner">Excel-lik</button>
            <button type="button" data-style="ny" aria-pressed="false" title="Forslag med bedre lesbarhet">Ny</button>
          </div>
          <label class="field">Tekst
            <input id="text-size" type="number" min="4" max="24" step="0.5" value="9" /> pt
          </label>
          <label class="field">Tilpasning
            <select id="fit-mode">
              <option value="sheet" selected>Tilpass til arket</option>
              <option value="fixed">Fast tekststørrelse</option>
            </select>
          </label>
          <label class="field" id="min-text-field">Minst
            <input id="min-text" type="number" min="4" max="20" step="0.5" value="6" /> pt
          </label>
          <span class="spacer"></span>
          <div class="group" role="group" aria-label="Zoom">
            <button type="button" id="zoom-out" title="Zoom ut" aria-label="Zoom ut" disabled>−</button>
            <button type="button" id="zoom-fit" title="Vis hele arket (Shift + dobbeltklikk)"><span id="zoom-level">100 %</span></button>
            <button type="button" id="zoom-width" title="La arket fylle bredden av vinduet">Fyll bredden</button>
            <button type="button" id="zoom-in" title="Zoom inn (eller Ctrl + hjul, dobbeltklikk)" aria-label="Zoom inn">+</button>
          </div>
          <button type="button" id="print" class="button" disabled>Skriv ut / lagre PDF</button>
        </div>
        <p class="muted small">Filen leses bare lokalt i nettleseren og lagres ingen steder. Ved PDF: velg «Lagre som PDF» i utskriftsdialogen. Arkstørrelsen er forhåndsvalgt. Zoom med Ctrl + hjul eller dobbeltklikk, og dra for å flytte.</p>
        <div id="file-info" aria-live="polite"></div>
      </section>
      <div id="sheet" class="sheet-host landscape"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
